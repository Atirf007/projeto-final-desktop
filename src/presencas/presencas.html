<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Cotil — Presenças</title>
  <style>
    :root {
      --cinza-50: #f8fafc;
      --cinza-100: #f3f4f6;
      --cinza-200: #e5e7eb;
      --cinza-300: #d1d5db;
      --cinza-400: #9ca3af;
      --cinza-500: #6b7280;
      --cinza-600: #4b5563;
      --cinza-700: #374151;
      --cinza-800: #1f2937;
      --cinza-900: #111827;

      --verde-50: #ecfdf5;
      --verde-100: #d1fae5;
      --verde-200: #a7f3d0;
      --verde-500: #10b981;
      --verde-600: #059669;
      --verde-700: #047857;

      --fundo: #f8fafc;
      --superficie: #ffffff;
      --texto: #111827;
      --texto-suave: #4b5563;
      --borda: #e5e7eb;
      --branco: #ffffff;

      --erro: #b91c1c;
      --erro-suave: #fef2f2;
      --erro-borda: #fecaca;
      --alerta: #92400e;
      --alerta-suave: #fffbeb;
      --alerta-borda: #fde68a;
      --sucesso: #166534;

      --esp-1: 4px;
      --esp-2: 8px;
      --esp-3: 12px;
      --esp-4: 16px;
      --esp-5: 24px;
      --esp-6: 32px;
      --fs-12: 12px;
      --fs-13: 13px;
      --fs-14: 14px;
      --fs-16: 16px;
      --fs-20: 20px;
      --altura-controle: 40px;
      --raio-card: 12px;
      --raio-controle: 8px;
      --fonte: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

      --primaria-900: var(--cinza-900);
      --primaria-800: var(--cinza-800);
      --primaria-700: var(--cinza-700);
      --primaria-600: var(--cinza-600);
      --primaria-500: var(--cinza-500);
      --secundaria: var(--verde-500);
      --secundaria-hover: var(--verde-600);
      --secundaria-suave: var(--verde-50);
      --bg-pagina: var(--fundo);
      --bg-card: var(--superficie);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--fonte); background: var(--bg-pagina); color: var(--primaria-900); line-height: 1.5; }
    header { display: flex; align-items: center; gap: 16px; background: var(--primaria-800); color: #fff; padding: 14px 28px; border-bottom: 3px solid var(--secundaria); }
    header h1 { margin: 0; font-size: 18px; }
    .voltar { padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: transparent; border: 1px solid var(--primaria-500); border-radius: 8px; cursor: pointer; }
    .voltar:hover { background: var(--primaria-700); }
    main { padding: 28px 32px 40px; max-width: 1280px; margin: 0 auto; }
    .painel { background: var(--bg-card); border: 1px solid var(--cinza-200); border-radius: var(--raio-card); padding: 24px; }
    .filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--cinza-200); }
    .campo { display: grid; gap: 6px; }
    .campo span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primaria-600); }
    input, select { padding: 12px 14px; font: inherit; font-size: 14px; border: 1px solid var(--cinza-200); border-radius: var(--raio-controle); background: var(--bg-card); color: var(--primaria-900); outline: none; }
    input:focus, select:focus { border-color: var(--secundaria); box-shadow: 0 0 0 3px var(--secundaria-suave); }
    .espaco { flex: 1; }
    h2 { margin: 0 0 16px; font-size: 16px; color: var(--primaria-800); }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th { padding: 12px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; text-align: left; color: var(--primaria-600); background: var(--cinza-100); border-bottom: 1px solid var(--cinza-200); white-space: nowrap; }
    tbody td { padding: 12px 14px; color: var(--primaria-700); border-bottom: 1px solid var(--cinza-200); }
    tbody tr:last-child td { border-bottom: none; }
    .col-data { white-space: nowrap; }
    .botao { padding: 12px 18px; font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: var(--primaria-800); border: 1px solid var(--primaria-800); border-radius: var(--raio-controle); cursor: pointer; }
    .botao:hover:not(:disabled) { background: var(--primaria-700); }
    .botao:disabled { opacity: 0.6; cursor: default; }
    .botao.secundario { color: var(--primaria-700); background: var(--bg-card); border-color: var(--cinza-200); }
    .botao.perigo { background: #991b1b; border-color: #991b1b; }
    .botao.pequeno { padding: 8px 12px; font-size: 12px; }
    .acoes-linha { display: flex; gap: 8px; flex-wrap: wrap; }
    .acoes { display: flex; justify-content: flex-end; gap: 14px; margin-top: 24px; }
    .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grade .span2 { grid-column: 1 / -1; }
    .msg-erro { min-height: 20px; margin: 0; font-size: 13px; color: var(--erro); }
    .msg-info { min-height: 20px; margin: 8px 0 0; font-size: 13px; color: var(--primaria-600); }
    #status { margin: 16px 0 0; font-size: 13px; color: var(--primaria-500); min-height: 20px; }
    #status.erro { color: var(--erro); }
    #status.sucesso { color: var(--secundaria-hover); }
    dialog { width: min(640px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--cinza-200); border-top: 4px solid var(--secundaria); border-radius: var(--raio-card); }
    dialog::backdrop { background: rgba(17, 24, 39, 0.45); }
    dialog h2 { margin: 24px 24px 0; }
    .dialogo-conteudo { padding: 20px 24px 24px; }
    .oculto { display: none !important; }
    @media (max-width: 760px) { main { padding: 20px; } .grade { grid-template-columns: 1fr; } .grade .span2 { grid-column: auto; } }
  </style>
</head>
<body>
  <header>
    <button id="voltar" type="button" class="voltar">Voltar ao menu</button>
    <h1>Presenças</h1>
  </header>
  <main>
    <section id="painel" class="painel">
      <div class="filtros">
        <label class="campo"><span>Buscar aluno</span><input id="busca" type="search" placeholder="Nome do aluno" maxlength="120"></label>
        <label class="campo"><span>Aluno</span><select id="filtro-aluno"><option value="">Todos</option></select></label>
        <label class="campo"><span>De</span><input id="filtro-inicio" type="date"></label>
        <label class="campo"><span>Até</span><input id="filtro-fim" type="date"></label>
        <label class="campo"><span>Origem</span>
          <select id="filtro-origem">
            <option value="">Todas</option>
            <option value="aula">Aula</option>
            <option value="livre">Livre</option>
            <option value="experimental">Experimental</option>
          </select>
        </label>
        <button id="limpar" type="button" class="botao secundario">Limpar</button>
        <span class="espaco"></span>
        <button id="novo" type="button" class="botao">Nova presença</button>
      </div>
      <h2 id="titulo">Presenças</h2>
      <div class="tabela">
        <table>
          <thead>
            <tr><th>Aluno</th><th>Aula</th><th>Data</th><th>Origem</th><th>Registrada em</th><th>Ações</th></tr>
          </thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
      <p id="status" role="status"></p>
    </section>
    <section id="acesso-negado" class="painel oculto">
      <h2>Acesso restrito</h2>
      <p class="msg-info">Esta tela é exclusiva de administradores e instrutores.</p>
    </section>
  </main>

  <dialog id="dialogo-formulario" aria-labelledby="titulo-formulario">
    <h2 id="titulo-formulario">Nova presença</h2>
    <form id="formulario" class="dialogo-conteudo" novalidate>
      <input id="presenca-id" type="hidden">
      <div class="grade">
        <label class="campo"><span>Aluno</span><select id="form-aluno"></select></label>
        <label class="campo"><span>Aula (opcional)</span><select id="form-aula"></select></label>
        <label class="campo"><span>Data da presença</span><input id="form-data" type="date"></label>
        <label class="campo"><span>Origem</span>
          <select id="form-origem">
            <option value="aula">Aula</option>
            <option value="livre">Livre</option>
            <option value="experimental">Experimental</option>
          </select>
        </label>
      </div>
      <p id="erro-formulario" class="msg-erro" role="alert"></p>
      <div class="acoes">
        <button id="cancelar" type="button" class="botao secundario">Cancelar</button>
        <button id="salvar" type="submit" class="botao">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-excluir" aria-labelledby="titulo-excluir">
    <h2 id="titulo-excluir">Excluir presença</h2>
    <div class="dialogo-conteudo">
      <p id="texto-excluir" class="msg-info"></p>
      <p id="erro-excluir" class="msg-erro" role="alert"></p>
      <div class="acoes">
        <button id="cancelar-excluir" type="button" class="botao secundario">Cancelar</button>
        <button id="confirmar-excluir" type="button" class="botao perigo">Excluir</button>
      </div>
    </div>
  </dialog>
</body>
</html>
