<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Cotil — Relatórios</title>
  <style>
    :root {
      --primaria-900: #111827;
      --primaria-800: #1f2937;
      --primaria-700: #374151;
      --primaria-600: #4b5563;
      --primaria-500: #6b7280;

      --secundaria: #10b981;
      --secundaria-hover: #059669;
      --secundaria-suave: #ecfdf5;
      --secundaria-borda: #a7f3d0;

      --bg-pagina: #f9fafb;
      --bg-card: #ffffff;
      --cinza-200: #e5e7eb;
      --cinza-100: #f3f4f6;

      --erro: #b91c1c;
      --raio-card: 12px;
      --raio-controle: 8px;
      --fonte: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--fonte);
      background: var(--bg-pagina);
      color: var(--primaria-900);
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
      background: var(--primaria-800);
      color: #ffffff;
      padding: 14px 28px;
      border-bottom: 3px solid var(--secundaria);
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.12);
    }

    .marca { display: flex; align-items: center; gap: 10px; }

    .marca-logo {
      width: 34px;
      height: 34px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--secundaria);
      border-radius: 8px;
    }

    .marca-logo svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marca-texto { display: grid; line-height: 1.2; }
    .marca-texto strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .marca-texto small {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cinza-200);
    }

    .divisor { width: 1px; height: 26px; background: var(--primaria-600); }

    header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

    .voltar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: transparent;
      border: 1px solid var(--primaria-500);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .voltar:hover { background: var(--primaria-700); border-color: #ffffff; }
    .voltar:focus-visible { outline: 2px solid var(--secundaria); outline-offset: 2px; }

    .voltar svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main { padding: 28px 32px 40px; max-width: 1120px; margin: 0 auto; }

    .painel {
      background: var(--bg-card);
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-card);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.05);
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--cinza-200);
    }

    .campo { display: grid; gap: 6px; }

    .campo span {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primaria-600);
    }

    select, input, button {
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      border-radius: var(--raio-controle);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    select, input {
      background: var(--bg-card);
      color: var(--primaria-900);
      border: 1px solid var(--cinza-200);
    }

    select:focus, input:focus {
      border-color: var(--secundaria);
      box-shadow: 0 0 0 3px var(--secundaria-suave);
    }

    .espaco { flex: 1; }

    button {
      background: var(--secundaria);
      border: 1px solid var(--secundaria);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--secundaria-hover); border-color: var(--secundaria-hover); }
    button:focus-visible { outline: 2px solid var(--secundaria-hover); outline-offset: 2px; }

    h2 {
      position: relative;
      margin: 0 0 16px;
      padding-left: 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primaria-800);
      text-transform: capitalize;
    }

    h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: var(--secundaria);
    }

    h2:empty { display: none; }

    #grafico svg { width: 100%; height: auto; display: block; }

    .grade { stroke: var(--cinza-200); stroke-width: 1; }
    .eixo { fill: var(--primaria-500); font-size: 12px; }
    .barra { fill: var(--primaria-600); }
    .barra.destaque { fill: var(--secundaria); }
    .valor { fill: var(--primaria-800); font-size: 13px; font-weight: 600; }
    .rotulo { fill: var(--primaria-700); font-size: 14px; font-weight: 600; }

    #status { margin: 16px 0 0; font-size: 13px; color: var(--primaria-500); }

    @media (max-width: 720px) {
      main { padding: 20px; }
      .espaco { display: none; }
    }

    @media print {
      body { background: #ffffff; }
      main { padding: 0; }
      .filtros, #status { display: none; }
      .painel { border: none; box-shadow: none; padding: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header>
    <button id="voltar" type="button" class="voltar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
      Voltar ao menu
    </button>
    <span class="divisor" aria-hidden="true"></span>
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M6.5 7.5v9" />
          <path d="M17.5 7.5v9" />
          <path d="M3.5 9.5v5" />
          <path d="M20.5 9.5v5" />
          <path d="M6.5 12h11" />
        </svg>
      </span>
      <span class="marca-texto">
        <strong>Cotil</strong>
        <small>Academia</small>
      </span>
    </div>
    <span class="divisor" aria-hidden="true"></span>
    <h1>Relatórios</h1>
  </header>
  <main>
    <section class="painel">
      <div class="filtros">
        <label class="campo">
          <span>Período</span>
          <select id="periodo">
            <option value="mensal">Mensal</option>
            <option value="anual">Anual</option>
          </select>
        </label>
        <label class="campo" id="campo-mes">
          <span>Mês</span>
          <input id="mes" type="month">
        </label>
        <label class="campo" id="campo-ano" hidden>
          <span>Ano</span>
          <input id="ano" type="number" min="2000" max="2100" step="1">
        </label>
        <span class="espaco"></span>
        <button id="exportar" type="button">Exportar PDF</button>
      </div>
      <h2 id="titulo"></h2>
      <div id="grafico"></div>
      <p id="status"></p>
    </section>
  </main>
</body>
</html>
