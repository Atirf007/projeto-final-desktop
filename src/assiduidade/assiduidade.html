<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Cotil — Evolução da assiduidade</title>
  <style>
    :root {
      --primaria-900: #111827;
      --primaria-800: #1f2937;
      --primaria-700: #374151;
      --primaria-600: #4b5563;
      --primaria-500: #6b7280;
      --secundaria: #10b981;
      --secundaria-hover: #059669;
      --secundaria-suave: #ecfdf5;
      --secundaria-borda: #a7f3d0;
      --bg-pagina: #f9fafb;
      --bg-card: #ffffff;
      --cinza-200: #e5e7eb;
      --cinza-100: #f3f4f6;
      --erro: #b91c1c;
      --raio-card: 12px;
      --raio-controle: 8px;
      --fonte: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--fonte);
      background: var(--bg-pagina);
      color: var(--primaria-900);
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
      background: var(--primaria-800);
      color: #ffffff;
      padding: 14px 28px;
      border-bottom: 3px solid var(--secundaria);
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.12);
    }

    .marca { display: flex; align-items: center; gap: 10px; }

    .marca-logo {
      width: 34px;
      height: 34px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--secundaria);
      border-radius: 8px;
    }

    .marca-logo svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marca-texto { display: grid; line-height: 1.2; }
    .marca-texto strong { font-size: 15px; font-weight: 700; }
    .marca-texto small {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #e5e7eb;
    }

    .divisor { width: 1px; height: 26px; background: var(--primaria-600); }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }

    .voltar {
      margin-left: auto;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: transparent;
      border: 1px solid var(--primaria-500);
      border-radius: var(--raio-controle);
      cursor: pointer;
    }

    .voltar:hover { background: var(--primaria-700); border-color: #ffffff; }
    .voltar:focus-visible { outline: 2px solid var(--secundaria); outline-offset: 2px; }

    main { padding: 28px 32px 40px; max-width: 1440px; margin: 0 auto; }

    .painel {
      background: var(--bg-card);
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-card);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.05);
    }

    .titulo-pagina h2 { margin: 0; font-size: 19px; color: var(--primaria-800); }
    .titulo-pagina p { margin: 6px 0 0; font-size: 14px; color: var(--primaria-500); }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
      padding: 14px 16px;
      margin: 20px 0;
      background: var(--cinza-100);
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-controle);
    }

    .filtros label { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: var(--primaria-600); }

    select, button {
      min-height: 40px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 14px;
      border-radius: var(--raio-controle);
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    button {
      color: #ffffff;
      background: var(--primaria-800);
      border-color: var(--primaria-800);
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--secundaria-hover); border-color: var(--secundaria-hover); }
    button:disabled { cursor: default; opacity: 0.6; }
    .periodo { margin-left: auto; align-self: center; font-size: 12px; color: var(--primaria-500); }

    #status { margin: 0 0 16px; font-size: 13px; color: var(--primaria-500); }
    #status.erro { color: var(--erro); font-weight: 600; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }

    .kpi {
      display: grid;
      gap: 6px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #f8f9fa 0%, #eef0f2 100%);
      border: 1px solid var(--cinza-200);
      border-left: 4px solid var(--secundaria);
      border-radius: 12px;
    }

    .kpi span { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primaria-500); }
    .kpi strong { font-size: 22px; font-weight: 800; color: var(--primaria-800); }
    .kpi small { font-size: 11px; color: var(--primaria-500); }

    table { width: 100%; border-collapse: separate; border-spacing: 0; background: #f8f9fa; border: 1px solid var(--cinza-200); border-radius: 12px; overflow: hidden; }
    thead th { position: sticky; top: 0; padding: 11px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primaria-600); background: #e5e8eb; border-bottom: 2px solid var(--secundaria); text-align: left; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid var(--cinza-200); vertical-align: top; font-size: 13px; }
    tbody tr:nth-child(even) { background: #f3f4f6; }
    tbody tr:hover { background: #e8eaed; }

    .selo { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 999px; }
    .selo.alta { color: #047857; background: var(--secundaria-suave); border: 1px solid var(--secundaria-borda); }
    .selo.media { color: #92400e; background: #fffbeb; border: 1px solid #fde68a; }
    .selo.baixa { color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; }
    .selo.inativo { color: #4b5563; background: #eef0f2; border: 1px solid #d1d5db; }
    .destaque { font-weight: 700; color: var(--primaria-800); }

    details summary { cursor: pointer; font-weight: 600; }
    details ul { margin: 8px 0 0; padding-left: 18px; color: var(--primaria-600); }
    details li { margin-bottom: 4px; }

    .vazio { padding: 14px; color: var(--primaria-500); background: var(--cinza-100); border: 1px dashed #cbd5e1; border-radius: 10px; }

    @media (max-width: 720px) {
      main { padding: 20px; }
      .periodo { margin-left: 0; }
      .tabela { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M6.5 7.5v9" />
          <path d="M17.5 7.5v9" />
          <path d="M3.5 9.5v5" />
          <path d="M20.5 9.5v5" />
          <path d="M6.5 12h11" />
        </svg>
      </span>
      <span class="marca-texto">
        <strong>Cotil</strong>
        <small>Academia</small>
      </span>
    </div>
    <span class="divisor" aria-hidden="true"></span>
    <h1>Evolução da assiduidade</h1>
    <button id="voltar" class="voltar" type="button">Voltar</button>
  </header>
  <main>
    <section class="painel">
      <div class="titulo-pagina">
        <h2>Presenças cruzadas com avaliações físicas</h2>
        <p>A frequência considera uma janela de 90 dias. As faixas abaixo usam a mesma análise do painel do aluno.</p>
      </div>
      <div class="filtros">
        <label>
          Aluno
          <select id="aluno"><option value="">Todos os alunos</option></select>
        </label>
        <button id="atualizar" type="button">Atualizar</button>
        <span id="periodo" class="periodo"></span>
      </div>
      <p id="status" role="alert"></p>
      <div id="kpis" class="kpis"></div>
      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th>Aluno</th>
              <th>Situação</th>
              <th>Faixa atual e evolução</th>
              <th>Presença (90 dias)</th>
              <th>Presenças</th>
              <th>Avaliações</th>
              <th>Δ peso</th>
              <th>Δ IMC</th>
            </tr>
          </thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
