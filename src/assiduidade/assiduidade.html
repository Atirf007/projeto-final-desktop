<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Cotil — Evolução da assiduidade</title>
  <style>
    :root {
      --cinza-50: #f8fafc;
      --cinza-100: #f3f4f6;
      --cinza-200: #e5e7eb;
      --cinza-300: #d1d5db;
      --cinza-400: #9ca3af;
      --cinza-500: #6b7280;
      --cinza-600: #4b5563;
      --cinza-700: #374151;
      --cinza-800: #1f2937;
      --cinza-900: #111827;

      --verde-50: #ecfdf5;
      --verde-100: #d1fae5;
      --verde-200: #a7f3d0;
      --verde-500: #10b981;
      --verde-600: #059669;
      --verde-700: #047857;

      --fundo: #f8fafc;
      --superficie: #ffffff;
      --texto: #111827;
      --texto-suave: #4b5563;
      --borda: #e5e7eb;
      --branco: #ffffff;

      --erro: #b91c1c;
      --erro-suave: #fef2f2;
      --erro-borda: #fecaca;
      --alerta: #92400e;
      --alerta-suave: #fffbeb;
      --alerta-borda: #fde68a;
      --sucesso: #166534;

      --esp-1: 4px;
      --esp-2: 8px;
      --esp-3: 12px;
      --esp-4: 16px;
      --esp-5: 24px;
      --esp-6: 32px;
      --fs-12: 12px;
      --fs-13: 13px;
      --fs-14: 14px;
      --fs-16: 16px;
      --fs-20: 20px;
      --altura-controle: 40px;
      --raio-card: 12px;
      --raio-controle: 8px;
      --fonte: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

      --primaria-900: var(--cinza-900);
      --primaria-800: var(--cinza-800);
      --primaria-700: var(--cinza-700);
      --primaria-600: var(--cinza-600);
      --primaria-500: var(--cinza-500);
      --secundaria: var(--verde-500);
      --secundaria-hover: var(--verde-600);
      --secundaria-suave: var(--verde-50);
      --secundaria-borda: var(--verde-200);
      --bg-pagina: var(--fundo);
      --bg-card: var(--superficie);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--fonte);
      background: var(--bg-pagina);
      color: var(--primaria-900);
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
      background: var(--primaria-800);
      color: var(--branco);
      padding: 14px 28px;
      border-bottom: 3px solid var(--secundaria);
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.12);
    }

    .marca { display: flex; align-items: center; gap: 10px; }

    .marca-logo {
      width: 34px;
      height: 34px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--secundaria);
      border-radius: 8px;
    }

    .marca-logo svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--branco);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marca-texto { display: grid; line-height: 1.2; }
    .marca-texto strong { font-size: 15px; font-weight: 700; }
    .marca-texto small {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--borda);
    }

    .divisor { width: 1px; height: 26px; background: var(--primaria-600); }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }

    .voltar {
      margin-left: auto;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: var(--branco);
      background: transparent;
      border: 1px solid var(--primaria-500);
      border-radius: var(--raio-controle);
      cursor: pointer;
    }

    .voltar:hover { background: var(--primaria-700); border-color: var(--branco); }
    .voltar:focus-visible { outline: 2px solid var(--secundaria); outline-offset: 2px; }

    main { padding: 28px 32px 40px; max-width: 1440px; margin: 0 auto; }

    .painel {
      background: var(--bg-card);
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-card);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.05);
    }

    .titulo-pagina h2 { margin: 0; font-size: 19px; color: var(--primaria-800); }
    .titulo-pagina p { margin: 6px 0 0; font-size: 14px; color: var(--primaria-500); }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
      padding: 14px 16px;
      margin: 20px 0;
      background: var(--cinza-100);
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-controle);
    }

    .filtros label { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: var(--primaria-600); }

    select, button {
      min-height: 40px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 14px;
      border-radius: var(--raio-controle);
      border: 1px solid var(--cinza-300);
      background: var(--branco);
    }

    button {
      color: var(--branco);
      background: var(--primaria-800);
      border-color: var(--primaria-800);
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--secundaria-hover); border-color: var(--secundaria-hover); }
    button:disabled { cursor: default; opacity: 0.6; }
    .periodo { margin-left: auto; align-self: center; font-size: 12px; color: var(--primaria-500); }

    #status { margin: 0 0 16px; font-size: 13px; color: var(--primaria-500); }
    #status.erro { color: var(--erro); font-weight: 600; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }

    .kpi {
      display: grid;
      gap: 6px;
      padding: 16px 18px;
      background: linear-gradient(135deg, var(--cinza-50) 0%, var(--cinza-100) 100%);
      border: 1px solid var(--cinza-200);
      border-left: 4px solid var(--secundaria);
      border-radius: 12px;
    }

    .kpi span { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primaria-500); }
    .kpi strong { font-size: 22px; font-weight: 800; color: var(--primaria-800); }
    .kpi small { font-size: 11px; color: var(--primaria-500); }

    table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--cinza-50); border: 1px solid var(--cinza-200); border-radius: 12px; overflow: hidden; }
    thead th { position: sticky; top: 0; padding: 11px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primaria-600); background: var(--borda); border-bottom: 2px solid var(--secundaria); text-align: left; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid var(--cinza-200); vertical-align: top; font-size: 13px; }
    tbody tr:nth-child(even) { background: var(--cinza-100); }
    tbody tr:hover { background: var(--borda); }

    .selo { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 999px; }
    .selo.alta { color: var(--verde-700); background: var(--secundaria-suave); border: 1px solid var(--secundaria-borda); }
    .selo.media { color: var(--alerta); background: var(--alerta-suave); border: 1px solid var(--alerta-borda); }
    .selo.baixa { color: var(--erro); background: var(--erro-suave); border: 1px solid var(--erro-borda); }
    .selo.inativo { color: var(--cinza-600); background: var(--cinza-100); border: 1px solid var(--cinza-300); }
    .destaque { font-weight: 700; color: var(--primaria-800); }

    details summary { cursor: pointer; font-weight: 600; }
    details ul { margin: 8px 0 0; padding-left: 18px; color: var(--primaria-600); }
    details li { margin-bottom: 4px; }

    .vazio { padding: 14px; color: var(--primaria-500); background: var(--cinza-100); border: 1px dashed var(--cinza-300); border-radius: 10px; }

    @media (max-width: 720px) {
      main { padding: 20px; }
      .periodo { margin-left: 0; }
      .tabela { overflow-x: auto; }
    }

    :where(body) { font-family: var(--fonte); font-size: var(--fs-14); color: var(--texto); line-height: 1.5; }
    :where(h1) { font-size: var(--fs-20); font-weight: 700; }
    :where(h2) { font-size: var(--fs-16); font-weight: 700; }
    :where(button, input, select, textarea) { font-family: inherit; font-size: var(--fs-14); min-height: var(--altura-controle); border-radius: var(--raio-controle); }
    :where(button) { gap: var(--esp-2); }
    :where(input, select, textarea) { padding: var(--esp-3) var(--esp-4); }
    :where(label, .campo > span) { color: var(--texto-suave); }
    :where(input::placeholder, textarea::placeholder) { color: var(--cinza-400); opacity: 1; }
    :where(button, input, select, textarea, a, summary):focus-visible { outline: 3px solid var(--verde-700); outline-offset: 2px; }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--verde-700);
      outline-offset: 2px;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--verde-600);
      box-shadow: 0 0 0 3px var(--verde-100);
    }
    .voltar:focus-visible { outline: 3px solid var(--verde-200); outline-offset: 3px; }
    :where(table) { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
    :where(thead th) { color: var(--cinza-700); background: var(--cinza-100); }
    :where(tbody td) { color: var(--texto-suave); line-height: 1.45; }
    :where(tbody tr:nth-child(even) td) { background: var(--cinza-50); }
    :where(.filtros, .acoes, .acoes-linha) { gap: var(--esp-3); }
  </style>
</head>
<body>
  <header>
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M6.5 7.5v9" />
          <path d="M17.5 7.5v9" />
          <path d="M3.5 9.5v5" />
          <path d="M20.5 9.5v5" />
          <path d="M6.5 12h11" />
        </svg>
      </span>
      <span class="marca-texto">
        <strong>Cotil</strong>
        <small>Academia</small>
      </span>
    </div>
    <span class="divisor" aria-hidden="true"></span>
    <h1>Evolução da assiduidade</h1>
    <button id="voltar" class="voltar" type="button">Voltar</button>
  </header>
  <main>
    <section class="painel">
      <div class="titulo-pagina">
        <h2>Presenças cruzadas com avaliações físicas</h2>
        <p>A frequência considera uma janela de 90 dias. As faixas abaixo usam a mesma análise do painel do aluno.</p>
      </div>
      <div class="filtros">
        <label>
          Aluno
          <select id="aluno"><option value="">Todos os alunos</option></select>
        </label>
        <button id="atualizar" type="button">Atualizar</button>
        <span id="periodo" class="periodo"></span>
      </div>
      <p id="status" role="alert"></p>
      <div id="kpis" class="kpis"></div>
      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th>Aluno</th>
              <th>Situação</th>
              <th>Faixa atual e evolução</th>
              <th>Presença (90 dias)</th>
              <th>Presenças</th>
              <th>Avaliações</th>
              <th>Δ peso</th>
              <th>Δ IMC</th>
            </tr>
          </thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
