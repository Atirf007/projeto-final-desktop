<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Cotil — Login</title>
  <style>
    :root {
      --primaria-900: #111827;
      --primaria-800: #1f2937;
      --primaria-700: #374151;
      --primaria-600: #4b5563;
      --primaria-500: #6b7280;

      --secundaria: #10b981;
      --secundaria-hover: #059669;
      --secundaria-suave: #ecfdf5;
      --secundaria-borda: #a7f3d0;

      --bg-pagina: #f9fafb;
      --bg-card: #ffffff;
      --cinza-200: #e5e7eb;
      --cinza-100: #f3f4f6;

      --erro: #b91c1c;
      --raio-card: 12px;
      --raio-controle: 8px;
      --fonte: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: var(--fonte);
      background: var(--bg-pagina);
      color: var(--primaria-900);
      line-height: 1.5;
    }

    .cartao {
      width: 100%;
      max-width: 384px;
      background: var(--bg-card);
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-card);
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.08);
      overflow: hidden;
    }

    .topo {
      background: var(--primaria-800);
      color: #ffffff;
      padding: 24px;
      border-bottom: 3px solid var(--secundaria);
    }

    .marca { display: flex; align-items: center; gap: 10px; }

    .marca-logo {
      width: 38px;
      height: 38px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--secundaria);
      border-radius: 9px;
    }

    .marca-logo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marca-texto { display: grid; line-height: 1.25; }
    .marca-texto strong { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .marca-texto small {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cinza-200);
    }

    .topo h1 { margin: 18px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
    .topo p { margin: 4px 0 0; font-size: 13px; color: var(--cinza-200); }

    form { padding: 24px; display: grid; gap: 16px; }

    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--primaria-700); }

    input {
      width: 100%;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-controle);
      background: var(--bg-card);
      color: var(--primaria-900);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus { border-color: var(--secundaria); box-shadow: 0 0 0 3px var(--secundaria-suave); }

    button {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: var(--secundaria);
      border: 1px solid var(--secundaria);
      border-radius: var(--raio-controle);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    button:hover { background: var(--secundaria-hover); border-color: var(--secundaria-hover); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--secundaria-hover); outline-offset: 2px; }
    button:disabled { opacity: 0.6; cursor: default; }

    #status { min-height: 20px; margin: 0; font-size: 13px; color: var(--erro); }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="topo">
      <div class="marca">
        <span class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6.5 7.5v9" />
            <path d="M17.5 7.5v9" />
            <path d="M3.5 9.5v5" />
            <path d="M20.5 9.5v5" />
            <path d="M6.5 12h11" />
          </svg>
        </span>
        <span class="marca-texto">
          <strong>Cotil</strong>
          <small>Academia</small>
        </span>
      </div>
      <h1>Entrar</h1>
      <p>Acesse com seu e-mail e senha</p>
    </div>
    <form id="formulario" novalidate>
      <label>E-mail
        <input id="email" type="email" autocomplete="username" maxlength="160">
      </label>
      <label>Senha
        <input id="senha" type="password" autocomplete="current-password" maxlength="128">
      </label>
      <p id="status" role="alert"></p>
      <button id="entrar" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
