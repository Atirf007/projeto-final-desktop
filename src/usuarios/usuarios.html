<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Cotil — Usuários</title>
  <style>
    :root {
      --primaria-900: #111827;
      --primaria-800: #1f2937;
      --primaria-700: #374151;
      --primaria-600: #4b5563;
      --primaria-500: #6b7280;

      --secundaria: #10b981;
      --secundaria-hover: #059669;
      --secundaria-suave: #ecfdf5;
      --secundaria-borda: #a7f3d0;

      --bg-pagina: #f9fafb;
      --bg-card: #ffffff;
      --cinza-200: #e5e7eb;
      --cinza-100: #f3f4f6;

      --erro: #b91c1c;
      --raio-card: 12px;
      --raio-controle: 8px;
      --fonte: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--fonte);
      background: var(--bg-pagina);
      color: var(--primaria-900);
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
      background: var(--primaria-800);
      color: #ffffff;
      padding: 14px 28px;
      border-bottom: 3px solid var(--secundaria);
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.12);
    }

    .marca { display: flex; align-items: center; gap: 10px; }

    .marca-logo {
      width: 34px;
      height: 34px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--secundaria);
      border-radius: 8px;
    }

    .marca-logo svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marca-texto { display: grid; line-height: 1.2; }
    .marca-texto strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .marca-texto small {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cinza-200);
    }

    .divisor { width: 1px; height: 26px; background: var(--primaria-600); }

    header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

    main { padding: 28px 32px 40px; max-width: 1120px; margin: 0 auto; }

    .painel {
      background: var(--bg-card);
      border: 1px solid var(--cinza-200);
      border-radius: var(--raio-card);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(17, 24, 39, 0.05);
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--cinza-200);
    }

    .campo { display: grid; gap: 6px; }

    .campo span {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primaria-600);
    }

    input {
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      border-radius: var(--raio-controle);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: var(--bg-card);
      color: var(--primaria-900);
      border: 1px solid var(--cinza-200);
    }

    input:focus {
      border-color: var(--secundaria);
      box-shadow: 0 0 0 3px var(--secundaria-suave);
    }

    .espaco { flex: 1; }

    h2 {
      position: relative;
      margin: 0 0 16px;
      padding-left: 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primaria-800);
    }

    h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: var(--secundaria);
    }

    .tabela { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }

    thead th {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
      color: var(--primaria-600);
      background: var(--cinza-100);
      border-bottom: 1px solid var(--cinza-200);
      white-space: nowrap;
    }

    tbody td {
      padding: 12px 14px;
      color: var(--primaria-700);
      border-bottom: 1px solid var(--cinza-200);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg-pagina); }

    thead th:first-child, tbody td:first-child { padding-left: 0; }
    thead th:last-child, tbody td:last-child { padding-right: 0; }

    .col-id { width: 64px; font-variant-numeric: tabular-nums; }
    td.col-id { color: var(--primaria-500); }
    .col-nome { font-weight: 600; color: var(--primaria-800); }
    .col-data { white-space: nowrap; color: var(--primaria-600); }

    .selo {
      display: inline-block;
      padding: 3px 10px;
      font-size: 11px;
      font-style: normal;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid transparent;
      border-radius: 999px;
      white-space: nowrap;
    }

    .selo.ativo { color: var(--secundaria-hover); background: var(--secundaria-suave); }
    .selo.inativo { color: var(--primaria-600); background: var(--cinza-100); border-color: var(--cinza-200); }

    #status { margin: 16px 0 0; font-size: 13px; color: var(--primaria-500); }
    #status:empty { margin: 0; }
    #status.erro { color: var(--erro); }

    @media (max-width: 720px) {
      main { padding: 20px; }
      .espaco { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M6.5 7.5v9" />
          <path d="M17.5 7.5v9" />
          <path d="M3.5 9.5v5" />
          <path d="M20.5 9.5v5" />
          <path d="M6.5 12h11" />
        </svg>
      </span>
      <span class="marca-texto">
        <strong>Cotil</strong>
        <small>Academia</small>
      </span>
    </div>
    <span class="divisor" aria-hidden="true"></span>
    <h1>Usuários</h1>
  </header>
  <main>
    <section class="painel">
      <div class="filtros">
        <label class="campo">
          <span>Buscar</span>
          <input id="busca" type="search" placeholder="Nome ou e-mail" maxlength="120">
        </label>
        <span class="espaco"></span>
      </div>
      <h2>Usuários cadastrados</h2>
      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Perfil</th>
              <th>Status</th>
              <th>Último acesso</th>
              <th>Cadastrado em</th>
            </tr>
          </thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
      <p id="status" role="status"></p>
    </section>
  </main>
</body>
</html>
